<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Income Zone</title>
    <meta name="theme-color" content="#ff9800">

    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --primary: #ff7a00;
            --secondary: #ff9800;
            --bg: #0f1115;
            --card: #1b1e24;
            --text: #ffffff;
            --muted: #9ca3af;
            --radius: 18px;
            --shadow: 0 10px 25px rgba(0,0,0,.25);
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container { width: 100%; max-width: 480px; }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
            animation: fadeUp .35s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
            font-size: 16px;
            width: 100%;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:active { transform: scale(.98); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .header h1 { font-size: 20px; font-weight: 700; }

        .status { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .status.ready { color: var(--success); }
        .status.loading { color: #f59e0b; }
        .status.error { color: var(--danger); }

        .ad-section {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 24px;
            padding: 30px 22px;
            text-align: center;
            color: #fff;
            box-shadow: 0 15px 35px rgba(124, 58, 237, .35);
            margin-bottom: 16px;
        }

        .ad-icon {
            font-size: 60px;
            margin-bottom: 12px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .ad-section h2 { font-size: 22px; margin-bottom: 8px; font-weight: 700; }
        .ad-section p { font-size: 14px; opacity: .9; margin-bottom: 20px; }

        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 14px;
            color: #fff;
            font-weight: 600;
            margin-top: 10px;
            text-align: center;
            animation: fadeUp .3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: #3b82f6; }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 16px;
        }
        #loading-overlay.show { display: flex; }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #444;
            border-top: 4px solid #ff9800;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { color: #fff; font-size: 14px; font-weight: 600; }

        .log-box {
            background: #0a0c10;
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #22c55e;
            max-height: 180px;
            overflow-y: auto;
        }

        .log-box p { margin: 4px 0; word-break: break-all; }
        .log-box .error { color: #ef4444; }
        .log-box .info { color: #3b82f6; }
        .log-box .warn { color: #f59e0b; }

        .log-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #9ca3af; }
    </style>
</head>
<body>

    <!-- লোডিং -->
    <div id="loading-overlay">
        <div class="loader"></div>
        <div class="loading-text" id="loading-text">Ad লোড হচ্ছে...</div>
    </div>

    <!-- টোস্ট -->
    <div id="toast-container"></div>

    <div class="container">

        <!-- হেডার -->
        <div class="card">
            <div class="header">
                <div>
                    <h1>💰 Daily Income Zone</h1>
                    <p class="status loading" id="sdk-status">⏳ SDK লোড হচ্ছে...</p>
                </div>
                <div style="font-size: 36px;">🎬</div>
            </div>
        </div>

        <!-- AdsGram Ad Section -->
        <div class="ad-section">
            <div class="ad-icon">🎬</div>
            <h2>Watch Rewarded Ad</h2>
            <p>Click the button below to watch an ad</p>
            <button onclick="watchAd()" class="btn-primary" id="watch-btn" disabled>
                ⏳ Loading SDK...
            </button>
        </div>

        <!-- Debug Log -->
        <div class="card">
            <div class="log-title">📋 Debug Log</div>
            <div class="log-box" id="log-box">
                <p>⏳ Initializing...</p>
            </div>
        </div>

    </div>

    <script>
        "use strict";

        // ============================================
        // 🔥 AdsGram Block ID
        // ============================================
        const ADSGRAM_BLOCK_ID = "int-50596";

        let AdController = null;

        // ============ লগ ============
        function log(message, type = "info") {
            const logBox = document.getElementById("log-box");
            const p = document.createElement("p");
            p.className = type;
            const time = new Date().toLocaleTimeString();
            p.textContent = `[${time}] ${message}`;
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // ============ টোস্ট ============
        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transition = "opacity .3s";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============ লোডিং ============
        function showLoading(text = "Ad লোড হচ্ছে...") {
            document.getElementById("loading-text").textContent = text;
            document.getElementById("loading-overlay").classList.add("show");
        }
        function hideLoading() {
            document.getElementById("loading-overlay").classList.remove("show");
        }

        // ============ SDK Status ============
        function updateStatus(text, className) {
            const status = document.getElementById("sdk-status");
            status.textContent = text;
            status.className = "status " + className;
        }

        // ==========================================
        // 🎬 Watch Ad — AdsGram Interstitial
        // ==========================================
        function watchAd() {
            if (!AdController) {
                log("❌ AdController নেই", "error");
                alert("Ad is not ready yet. Please try again.");
                return;
            }

            log("▶️ AdsGram Ad show() কল...", "info");
            showLoading("Ad লোড হচ্ছে...");

            AdController.show()
                .then((result) => {
                    hideLoading();
                    log("✅ Ad done — user watched or closed", "info");
                    log("📊 Result: " + JSON.stringify(result), "info");
                    showToast("🎬 Ad finished or closed!", "success");
                    // ⚠️ Interstitial — reward logic নেই
                })
                .catch((result) => {
                    hideLoading();
                    const errMsg = result?.description || result?.error || "Unknown error";
                    log("❌ Ad error: " + errMsg, "error");
                    console.log("AdsGram Error:", result);
                    showToast("❌ Ad error: " + errMsg, "error");
                })
                .finally(() => {
                    hideLoading();
                    log("🏁 Ad process সম্পূর্ণ", "info");
                });
        }

        // ============ AdsGram Init ============
        function initAdsGram() {
            try {
                if (typeof window.Adsgram === "undefined") {
                    log("❌ Adsgram SDK লোড হয়নি", "error");
                    return false;
                }

                AdController = window.Adsgram.init({
                    blockId: ADSGRAM_BLOCK_ID
                });

                log("✅ AdsGram initialized", "info");
                log("📦 Block ID: " + ADSGRAM_BLOCK_ID, "info");
                return true;
            } catch (e) {
                log("❌ AdsGram init error: " + e.message, "error");
                return false;
            }
        }

        // ============ Telegram Init ============
        function initTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                log("✅ Telegram Web App initialized", "info");

                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    log("👤 User: " + (user.first_name || "Unknown"), "info");
                }
            } else {
                log("⚠️ Telegram SDK নেই", "warn");
            }
        }

        // ============ Init ============
        function init() {
            log("🚀 App চালু হচ্ছে...", "info");
            initTelegram();

            let attempts = 0;
            const maxAttempts = 20;

            const checkInterval = setInterval(() => {
                attempts++;

                if (typeof window.Adsgram !== "undefined") {
                    clearInterval(checkInterval);
                    log("✅ Adsgram SDK লোড হয়েছে", "info");

                    const ok = initAdsGram();
                    const watchBtn = document.getElementById("watch-btn");

                    if (ok) {
                        updateStatus("✅ SDK Ready", "ready");
                        watchBtn.disabled = false;
                        watchBtn.innerHTML = "▶️ Watch Ad";
                        showToast("✅ Ad SDK Ready!", "success");
                    } else {
                        updateStatus("⚠️ Init Failed", "error");
                        watchBtn.innerHTML = "⚠️ Init Failed";
                    }
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    log("❌ ১০ সেকেন্ডেও SDK লোড হয়নি!", "error");
                    updateStatus("❌ SDK Load Failed", "error");
                    document.getElementById("watch-btn").innerHTML = "❌ SDK Not Loaded";
                }
            }, 500);
        }

        document.addEventListener("DOMContentLoaded", init);

        window.addEventListener("error", (e) => {
            log("❌ Global Error: " + e.message, "error");
        });
    </script>

</body>
</html>
