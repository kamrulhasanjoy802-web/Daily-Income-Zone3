<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Income Zone</title>
    <meta name="theme-color" content="#ff9800">

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --primary: #ff7a00;
            --secondary: #ff9800;
            --bg: #0f1115;
            --card: #1b1e24;
            --text: #ffffff;
            --muted: #9ca3af;
            --radius: 18px;
            --shadow: 0 10px 25px rgba(0,0,0,.25);
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container { width: 100%; max-width: 480px; }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
            animation: fadeUp .35s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
            font-size: 16px;
            width: 100%;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:active { transform: scale(.98); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .header h1 { font-size: 20px; font-weight: 700; }

        .status { font-size: 13px; color: var(--success); margin-top: 4px; }

        .ad-section {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            border-radius: 24px;
            padding: 30px 22px;
            text-align: center;
            color: #fff;
            box-shadow: 0 15px 35px rgba(30, 64, 175, .35);
            margin-bottom: 16px;
        }

        .ad-icon {
            font-size: 60px;
            margin-bottom: 12px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .ad-section h2 { font-size: 22px; margin-bottom: 8px; font-weight: 700; }
        .ad-section p { font-size: 14px; opacity: .9; margin-bottom: 20px; }

        .btn-adsterra {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
            font-size: 16px;
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-adsterra:hover { transform: translateY(-2px); }
        .btn-adsterra:active { transform: scale(.98); }

        .btn-adsterra.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-adsterra.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 14px;
            color: #fff;
            font-weight: 600;
            margin-top: 10px;
            text-align: center;
            animation: fadeUp .3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: #3b82f6; }

        .log-box {
            background: #0a0c10;
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #22c55e;
            max-height: 180px;
            overflow-y: auto;
        }

        .log-box p { margin: 4px 0; word-break: break-all; }
        .log-box .info { color: #3b82f6; }
        .log-box .error { color: #ef4444; }

        .log-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #9ca3af; }
    </style>
</head>
<body>

    <!-- টোস্ট -->
    <div id="toast-container"></div>

    <div class="container">

        <!-- হেডার -->
        <div class="card">
            <div class="header">
                <div>
                    <h1>💰 Daily Income Zone</h1>
                    <p class="status" id="sdk-status">✅ App Ready</p>
                </div>
                <div style="font-size: 36px;">🎬</div>
            </div>
        </div>

        <!-- Adsterra Section -->
        <div class="ad-section">
            <div class="ad-icon">🔥</div>
            <h2>Watch Ads</h2>
            <p>Click any button below to watch an ad</p>

            <button onclick="watchAd1()" class="btn-adsterra">
                🎬 Watch Ads #1
            </button>

            <button onclick="watchAd2()" class="btn-adsterra blue">
                🎬 Watch Ads #2
            </button>

            <button onclick="watchAd3()" class="btn-adsterra purple">
                🎬 Watch Ads #3
            </button>
        </div>

        <!-- Debug Log -->
        <div class="card">
            <div class="log-title">📋 Debug Log</div>
            <div class="log-box" id="log-box">
                <p>⏳ Initializing...</p>
            </div>
        </div>

    </div>

    <script>
        "use strict";

        // ============================================
        // 🔥 Adsterra Ad Links (৩টি)
        // ============================================
        const ADSTERRA_LINKS = {
            ad1: {
                id: "31251544",
                url: "https://www.profitableratecpmnetwork.com/m8rza4zqka?key=59d89a9e957a328dafc854210ff100d1"
            },
            ad2: {
                id: "31249862",
                url: "https://www.profitableratecpmnetwork.com/d5y37cxc6?key=1c9fee3a57ed6ebb649607fee9dffb4f"
            },
            ad3: {
                id: "31247436",
                url: "https://www.profitableratecpmnetwork.com/d4jctn1gx?key=b2afed700e622656b71af7b02f629332"
            }
        };

        // ============ লগ ============
        function log(message, type = "info") {
            const logBox = document.getElementById("log-box");
            const p = document.createElement("p");
            p.className = type;
            const time = new Date().toLocaleTimeString();
            p.textContent = `[${time}] ${message}`;
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // ============ টোস্ট ============
        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transition = "opacity .3s";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // 🔥 Ad Open Function — Telegram Mini App এ খুলবে
        // ==========================================
        function openAdLink(adName, url) {
            log(`🔥 ${adName} ক্লিক করা হয়েছে`, "info");
            log(`📤 Link: ${url}`, "info");

            showToast(`🎬 Opening ${adName}...`, "success");

            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    // ✅ Telegram Mini App-এর ভেতরে Ad খুলবে
                    window.Telegram.WebApp.openLink(url);
                    log(`✅ Telegram openLink দিয়ে ${adName} খোলা হয়েছে`, "info");
                } else {
                    // ব্রাউজার fallback
                    const newWindow = window.open(url, "_blank");
                    if (!newWindow || newWindow.closed) {
                        window.location.href = url;
                    }
                    log(`✅ Browser এ ${adName} খোলা হয়েছে`, "info");
                }
            } catch (error) {
                log(`❌ ${adName} Error: ${error.message}`, "error");
                window.location.href = url;
            }
        }

        // ==========================================
        // 🔥 Adsterra Ad Functions (৩টি)
        // ==========================================
        function watchAd1() {
            openAdLink("Adsterra #1", ADSTERRA_LINKS.ad1.url);
        }

        function watchAd2() {
            openAdLink("Adsterra #2", ADSTERRA_LINKS.ad2.url);
        }

        function watchAd3() {
            openAdLink("Adsterra #3", ADSTERRA_LINKS.ad3.url);
        }

        // ============ Telegram Init ============
        function initTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                log("✅ Telegram Web App initialized", "info");

                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    log("👤 User: " + (user.first_name || "Unknown"), "info");
                }
            } else {
                log("⚠️ Telegram SDK নেই (ব্রাউজারে চলছে)", "info");
            }
        }

        // ============ Init ============
        function init() {
            log("🚀 App চালু হচ্ছে...", "info");
            log("🔥 Adsterra Ad #1 ID: " + ADSTERRA_LINKS.ad1.id, "info");
            log("🔥 Adsterra Ad #2 ID: " + ADSTERRA_LINKS.ad2.id, "info");
            log("🔥 Adsterra Ad #3 ID: " + ADSTERRA_LINKS.ad3.id, "info");
            initTelegram();
            showToast("✅ App Ready!", "success");
        }

        document.addEventListener("DOMContentLoaded", init);

        window.addEventListener("error", (e) => {
            log("❌ Global Error: " + e.message, "error");
        });

    </script>

</body>
</html>
